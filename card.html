<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>TABELAS!!!</title>
    <link rel="stylesheet" href="stylecard.css">
</head>
<body>

        </tr>

        </tr>

                <img class="perfil" src="./imagens/andrewpixel.png">
            </th>

            <td>AndrewRL</td>
        </tr>

                    <div class="barra-dentro"></div>
                </div>
               </th>
        </tr>

        </tr>

                    <img src="imagens/teia.png">

</html>
