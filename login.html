<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylelogin.css">
    <title> Login </title>
</head>
<body>

    <!--Cabeçalho e menu-->

    <header>
        <div id="logo">
            <h1>AR</h1><h3>&</h3><h1>MP</h1>
        </div>
        <nav>
            <a href="index.html">Início</a>
            <a href="card.html">Cards</a>
            <a href="login.html">Cadastre-se</a>
        </nav>
    </header>
    
    <main class="container">
        <form>
            <h1> Login de Usuário </h1>
            <div class="input-box">
                <input placeholder="Usuário" type="email">
                <img src="imagens/user-regular.png" alt=" Ícone Usuário">
            </div>
            <div class="input-box">
                <input placeholder="Senha" type="password">
                <img src="imagens/lock-solid.png" alt="Ícone de Senha">
            </div>

            <div class="lembrar-login">
                <label>
                <input type="checkbox">
                Lembrar minha senha
                </label>
                <a href="#">Esqueci minha senha</a>
            </div>

            <button type="submit" class="Login"> Login </button>

            <div class="register-link">
                <p>Não tem uma conta? <a href="#"> Cadastre-se </a></p>
            </div>


            <div class="seguranca">
                <img src="imagens/lock-solid.png" alt="Ícone de cadeado">
                    <span>Conexão segura e protegida</span>
            </div>
        </form>
    </main>
</body>
</html>
